name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
      - '.nvmrc'
      - '.editorconfig'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'
      - '.nvmrc'
      - '.editorconfig'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test
