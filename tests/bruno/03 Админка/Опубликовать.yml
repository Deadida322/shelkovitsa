info:
  name: Опубликовать
  type: http
  seq: 13
http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/product-article/{{articleId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isVisible": true
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('опубликован', () => expect(res.getBody().isVisible).to.eql(true));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
