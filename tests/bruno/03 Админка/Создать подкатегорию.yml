info:
  name: Создать подкатегорию
  type: http
  seq: 18
http:
  method: POST
  url: "{{baseUrl}}/api/admin/product-category/{{categoryId}}/subcategories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Носки"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 201', () => expect(res.getStatus()).to.equal(201));
        bru.setVar('subcategoryId', res.getBody().id);
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
