info:
  name: Категорию с подкатегорией удалить нельзя → 400
  type: http
  seq: 19
http:
  method: DELETE
  url: "{{baseUrl}}/api/admin/product-category/{{categoryId}}"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 400', () => expect(res.getStatus()).to.equal(400));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(400);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
