info:
  name: Найти артикул в админском списке
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/api/admin/product-article?page=0&itemsPerPage=20&query=PM-TEST-001"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
    - name: query
      value: PM-TEST-001
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('артикул найден', () => {
            const { data, count } = res.getBody();
            expect(count).to.eql(1);
            expect(data[0].article).to.eql('PM-TEST-001');
            expect(data[0]).to.have.property('is_deleted', false);
            expect(data[0].price).to.eql(199000);
            expect(data[0].price).to.be.a('number');
            bru.setVar('articleId', data[0].id);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
