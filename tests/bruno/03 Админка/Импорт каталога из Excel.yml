info:
  name: Импорт каталога из Excel
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/api/admin/product-article/import"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ../fixtures/import.xlsx
      - name: isDeletedOther
        type: text
        value: "false"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: >-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));

        test('в ответе — Excel с ошибками (пустой)', () =>
        expect(res.getSize().body).to.be.above(0));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
docs: >-
  Тестовый артикул PM-TEST-001 (2 размера). Категория «Postman» в xlsx создаётся импортом.
