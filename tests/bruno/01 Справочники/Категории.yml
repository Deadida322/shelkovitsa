info:
  name: Категории
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/api/product-category"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('массив категорий с подкатегориями', () => {
            const body = res.getBody();
            expect(body).to.be.an('array');
            body.forEach(c => expect(c).to.have.keys('id', 'name', 'productSubcategories'));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
