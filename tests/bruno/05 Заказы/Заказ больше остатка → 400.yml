info:
  name: Заказ больше остатка → 400
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/api/order"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fio": "Гость",
        "mail": "guest@test.ru",
        "tel": "+79991234567",
        "region": "Москва",
        "address": "ул. Тестовая, д. 1",
        "deliveryTypeId": {{deliveryTypeId}},
        "orderProducts": [
          {
            "productId": {{productId}},
            "amount": 999
          }
        ]
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: >-
        test('статус 400', () => expect(res.getStatus()).to.equal(400));

        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(400);
            expect(error).to.have.property('message');
        });

        test('причина — остаток', () =>
        expect(res.getBody().error.message).to.include('Недостаточное'));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
