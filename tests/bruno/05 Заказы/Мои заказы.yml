info:
  name: Мои заказы
  type: http
  seq: 6
http:
  method: GET
  url: "{{baseUrl}}/api/order?page=0&itemsPerPage=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('видит свой заказ, без данных пользователя', () => {
            const { data, count } = res.getBody();
            expect(count).to.eql(1);
            expect(data[0]).to.not.have.property('user');
        });
        test('нет служебных полей пользователя', () => {
            expect(JSON.stringify(res.getBody())).to.not.match(/password|\$2[aby]\$|basket|"role"/);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
