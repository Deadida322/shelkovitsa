info:
  name: Все заказы (админ)
  type: http
  seq: 9
http:
  method: GET
  url: "{{baseUrl}}/api/admin/order?page=0&itemsPerPage=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('новые сначала, заказ гостя в списке', () => {
            const { data } = res.getBody();
            expect(data.map(o => o.id)).to.include(Number(bru.getVar('orderId')));
            const dates = data.map(o => o.id);
            expect(dates).to.eql([...dates].sort((a, b) => b - a));
        });
        test('нет служебных полей пользователя', () => {
            expect(JSON.stringify(res.getBody())).to.not.match(/password|\$2[aby]\$|basket|"role"/);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
