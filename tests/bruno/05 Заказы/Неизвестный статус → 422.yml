info:
  name: Неизвестный статус → 422
  type: http
  seq: 11
http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/order/{{orderId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "lost"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 422', () => expect(res.getStatus()).to.equal(422));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(422);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
