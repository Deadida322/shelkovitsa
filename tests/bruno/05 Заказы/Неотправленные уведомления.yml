info:
  name: Неотправленные уведомления
  type: http
  seq: 13
http:
  method: GET
  url: "{{baseUrl}}/api/admin/order/telegram-failed"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('массив заказов', () => expect(res.getBody()).to.be.an('array'));
        test('нет служебных полей пользователя', () => {
            expect(JSON.stringify(res.getBody())).to.not.match(/password|\$2[aby]\$|basket|"role"/);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
