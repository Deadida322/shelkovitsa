info:
  name: Вход покупателем
  type: http
  seq: 4
http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "mail": "{{customerMail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 201', () => expect(res.getStatus()).to.equal(201));
        test('роль', () => expect(res.getBody()).to.have.property('isAdmin'));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
