info:
  name: Healthcheck
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('БД доступна', () => expect(res.getBody().status).to.eql('ok'));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
