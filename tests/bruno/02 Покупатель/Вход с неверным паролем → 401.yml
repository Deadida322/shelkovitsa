info:
  name: Вход с неверным паролем → 401
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "mail": "{{customerMail}}",
        "password": "wrong-password"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 401', () => expect(res.getStatus()).to.equal(401));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(401);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
