info:
  name: Кто я
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: >-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));

        test('это зарегистрированный покупатель', () =>
        expect(res.getBody().mail).to.eql(bru.getVar('customerMail')));

        test('нет служебных полей пользователя', () => {
            expect(JSON.stringify(res.getBody())).to.not.match(/password|\$2[aby]\$|basket|"role"/);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
