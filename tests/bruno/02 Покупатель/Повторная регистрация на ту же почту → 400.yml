info:
  name: Повторная регистрация на ту же почту → 400
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "mail": "{{customerMail}}",
        "fio": "Дубль",
        "password": "{{customerPassword}}",
        "rePassword": "{{customerPassword}}"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 400', () => expect(res.getStatus()).to.equal(400));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(400);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
