info:
  name: Сохранить корзину
  type: http
  seq: 9
http:
  method: PUT
  url: "{{baseUrl}}/api/user/basket"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "productId": 1,
          "amount": 2,
          "id": "1",
          "name": "Из Bruno",
          "price": 99000
        }
      ]
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: test('статус 200', () => expect(res.getStatus()).to.equal(200));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
