info:
  name: Админка покупателю → 403
  type: http
  seq: 12
http:
  method: GET
  url: "{{baseUrl}}/api/admin/order?page=0&itemsPerPage=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 403', () => expect(res.getStatus()).to.equal(403));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(403);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
