info:
  name: "Фасеты: price в копейках"
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/api/product-article/filters?query=PM-TEST-001"
  params:
    - name: query
      value: PM-TEST-001
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('min/max цены — копейки числами', () => {
            const { price } = res.getBody();
            expect(price.min).to.eql(199000);
            expect(price.max).to.eql(199000);
            expect(price.min).to.be.a('number');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
