info:
  name: Несуществующий артикул → 404
  type: http
  seq: 11
http:
  method: GET
  url: "{{baseUrl}}/api/product-article/999999"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 404', () => expect(res.getStatus()).to.equal(404));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(404);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
