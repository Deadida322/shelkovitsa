info:
  name: Популярное
  type: http
  seq: 8
http:
  method: GET
  url: "{{baseUrl}}/api/product-article/popular"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('не больше 3', () => expect(res.getBody().length).to.be.at.most(3));
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
