info:
  name: Поиск в каталоге
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/api/product-article?page=0&itemsPerPage=20&query=PM-TEST-001"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
    - name: query
      value: PM-TEST-001
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('опубликованный артикул виден', () => {
            const { data, count } = res.getBody();
            expect(count).to.eql(1);
            expect(data[0].id).to.eql(Number(bru.getVar('articleId')));
            expect(data[0]).to.not.have.property('is_deleted');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
