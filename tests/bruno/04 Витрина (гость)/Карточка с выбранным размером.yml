info:
  name: Карточка с выбранным размером
  type: http
  seq: 6
http:
  method: GET
  url: "{{baseUrl}}/api/product-article/{{articleId}}?productSizeId={{sizeId}}"
  params:
    - name: productSizeId
      value: "{{sizeId}}"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('размеры не сужаются, выбранный размер возвращается', () => {
            const a = res.getBody();
            expect(a.productSizes).to.have.length(2);
            expect(a.currentProductSize).to.eql(Number(bru.getVar('sizeId')));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
