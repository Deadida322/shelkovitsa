info:
  name: Карточка товара
  type: http
  seq: 5
http:
  method: GET
  url: "{{baseUrl}}/api/product-article/{{articleId}}"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('цена числом, фото и варианты', () => {
            const a = res.getBody();
            expect(a.price).to.eql(199000);
            expect(a.price).to.be.a('number');
            expect(a.productFiles).to.have.length(1);
            expect(a.productSizes).to.have.length(2);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
