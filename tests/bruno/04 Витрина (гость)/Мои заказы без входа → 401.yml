info:
  name: Мои заказы без входа → 401
  type: http
  seq: 12
http:
  method: GET
  url: "{{baseUrl}}/api/order?page=0&itemsPerPage=20"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 401', () => expect(res.getStatus()).to.equal(401));
        test('ошибка в едином формате', () => {
            const { error } = res.getBody();
            expect(error.statusCode).to.eql(401);
            expect(error).to.have.property('message');
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
