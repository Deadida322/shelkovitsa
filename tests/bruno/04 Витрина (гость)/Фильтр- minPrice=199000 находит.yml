info:
  name: "Фильтр: minPrice=199000 находит"
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/api/product-article?page=0&itemsPerPage=20&query=PM-TEST-001&minPrice=199000"
  params:
    - name: page
      value: "0"
      type: query
    - name: itemsPerPage
      value: "20"
      type: query
    - name: query
      value: PM-TEST-001
      type: query
    - name: minPrice
      value: "199000"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        test('статус 200', () => expect(res.getStatus()).to.equal(200));
        test('ровно 1990 ₽ находится по нижней границе в копейках', () => {
            const { count, data } = res.getBody();
            expect(count).to.eql(1);
            expect(data[0].price).to.eql(199000);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
